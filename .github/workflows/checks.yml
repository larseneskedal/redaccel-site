# Same checks as the pre-push hook on the mini. Render deploys main only when this passes
# (autoDeployTrigger: checksPass), so a broken commit never reaches redaccel.com.
name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # what Render runs (3.13.4 default)
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:cacheprovider tests
